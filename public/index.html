<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Pagos - Davivienda</title>
    
    <!-- Fuente Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* --- CONFIGURACIÓN BÁSICA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; 
        }

        /* --- HEADER (BARRA ROJA PC) --- */
        header {
            background-color: #E30613; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px 0 0; 
            color: white;
            height: 85px; 
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .logo-container img {
            height: 45px; 
            object-fit: contain;
            margin-left: 60px; 
        }

        .header-info {
            text-align: right;
            font-size: 14px;
            line-height: 1.4;
            font-weight: 400;
            padding-right: 40px; 
        }

        /* --- CUERPO PRINCIPAL --- */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            background-image: url('mujer.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            color: white;
            padding: 20px;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* --- TEXTOS --- */
        .title {
            font-size: 36px; 
            font-weight: 300; 
            margin-bottom: 0px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 34px; 
            font-weight: 700; 
            margin-bottom: 10px;
        }

        .instruction {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 40px;
        }

        /* --- BOTONES --- */
        .buttons-container {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }

        .btn-card {
            background-color: #333333; 
            border-radius: 8px;
            width: 120px; 
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none; /* Quita el subrayado del enlace */
            color: white;
            transition: transform 0.2s; /* Efecto visual al pasar el mouse */
        }

        .btn-card:hover {
            transform: scale(1.05); /* Se agranda un poquito al pasar el mouse */
        }

        .btn-card img {
            width: 45px; 
            height: 45px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: brightness(0) invert(1); 
        }

        .btn-card span {
            font-size: 13px;
            line-height: 1.2;
            text-align: center;
            font-weight: 400;
        }

        .btn-card span b {
            display: block;
            font-weight: 700;
        }

        .warning-text {
            font-size: 18px;
            font-weight: 300;
            line-height: 1.5;
        }

        /* --- FOOTER (PIE DE PÁGINA PC) --- */
        footer {
            background-color: #000000;
            color: white;
            display: flex;
            align-items: center; 
            justify-content: space-between; 
            padding: 0 40px;
            height: 90px; 
            z-index: 10;
        }

        .footer-left {
            display: flex;
            align-items: center;
            width: 250px; 
        }

        .footer-left img {
            height: 45px; 
            width: auto;
            object-fit: contain;
        }

        .footer-text {
            font-size: 15px;
            font-weight: 400;
            text-align: center;
            flex-grow: 1;
        }

        .footer-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 250px;
        }

        .footer-right img {
            height: 60px; 
            width: auto;
            object-fit: contain;
        }

        /* =========================================
           DISEÑO RESPONSIVO (EXCLUSIVO CELULARES)
           ========================================= */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }

            header {
                flex-direction: column;
                height: auto;
                padding: 15px 0 0 0; 
                align-items: center; 
                gap: 15px;
                width: 100%;
            }

            .logo-container {
                width: 100%;
                justify-content: center;
            }

            .logo-container img {
                height: 40px;
                margin-left: 0; 
            }

            .header-info {
                background-color: white;
                color: #666;
                text-align: center;
                width: 100%; 
                margin-left: 0;
                padding: 10px 0;
                font-size: 13px;
            }

            main {
                padding: 40px 20px;
            }

            .title { font-size: 28px; }
            .subtitle { font-size: 26px; }
            .instruction { font-size: 14px; }
            
            .buttons-container {
                gap: 15px;
                margin-bottom: 40px;
            }

            .btn-card {
                width: 110px;
                height: 110px;
            }

            .btn-card img {
                width: 40px;
                height: 40px;
            }

            .warning-text { font-size: 16px; }

            /* --- FOOTER EN CELULAR --- */
            footer {
                flex-direction: column;
                height: auto;
                padding: 12px 15px; 
                gap: 5px; 
            }

            .footer-text {
                order: -1; 
                font-size: 13px;
            }

            .footer-left {
                width: auto;
                justify-content: center;
            }

            .footer-left img {
                height: 22px; 
            }

            .footer-right {
                display: none; 
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-container">
            <img src="davi.png" alt="Davivienda">
        </div>
        <div class="header-info">
            <div id="fecha-hora">Cargando fecha...</div>
            <div id="codigo-cus">Código único CUS: Cargando...</div>
        </div>
    </header>

    <!-- CUERPO -->
    <main>
        <div class="content">
            <div class="title">Bienvenido al Portal de</div>
            <div class="subtitle">Pagos en Línea y PSE</div>
            <div class="instruction">Seleccione el canal por el cual realizará el pago:</div>

            <div class="buttons-container">
                <!-- BOTÓN PERSONA (Redirige a inicio.html) -->
                <a href="inicio.html" class="btn-card">
                    <img src="persona.png" alt="Persona Natural">
                    <span>Persona<br><b>Natural</b></span>
                </a>

                <!-- BOTÓN EMPRESA (Redirige a inicio.html) -->
                <a href="inicio.html" class="btn-card">
                    <img src="image.png" alt="Empresa">
                    <span>Empresa</span>
                </a>
            </div>

            <div class="warning-text">
                No olvide Cerrar Sesión<br>
                una vez termine sus transacciones.
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-left">
            <img src="vig.png" alt="Vigilado">
        </div>
        
        <div class="footer-text">
            Banco Davivienda S.A. Todos los derechos reservados 2023.
        </div>

        <div class="footer-right">
            <img src="blanco.png" alt="Davivienda">
        </div>
    </footer>

    <!-- SCRIPT FECHA Y CUS -->
    <script>
        function actualizarFecha() {
            const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            const ahora = new Date();
            
            const diaSemana = dias[ahora.getDay()];
            const dia = ahora.getDate();
            const mes = meses[ahora.getMonth()];
            const anio = ahora.getFullYear();
            
            let horas = ahora.getHours();
            const minutos = ahora.getMinutes().toString().padStart(2, '0');
            const ampm = horas >= 12 ? 'PM' : 'AM';
            
            horas = horas % 12;
            horas = horas ? horas : 12; 
            
            const fechaFormateada = `${diaSemana} ${dia} de ${mes} de ${anio}, ${horas}:${minutos} ${ampm}`;
            document.getElementById('fecha-hora').textContent = fechaFormateada;
        }

        function generarCUS() {
            const parte1 = Math.floor(100 + Math.random() * 900);
            const parte2 = Math.floor(1000000 + Math.random() * 9000000);
            document.getElementById('codigo-cus').textContent = `Código único CUS: ${parte1}-${parte2}`;
        }

        actualizarFecha();
        generarCUS();
    </script>
</body>
</html>
